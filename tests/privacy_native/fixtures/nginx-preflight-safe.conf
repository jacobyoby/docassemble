server {
    listen 127.0.0.1:18081;
    set $quoted "quote\" and \' and \\ and \n";
    set $header "escaped\"
# configuration file /fake:
end";
    if ($request_uri ~ "\?id=\b[0-9]+\b") { set $quoted 'matched'; }
    location ~ \.pdf$ { return 200 'synthetic\n'; }
    location / { return 200 'synthetic'; }
}
