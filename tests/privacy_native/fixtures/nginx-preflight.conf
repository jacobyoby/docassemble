# Synthetic native -T acceptance fixture. No public listener is started.
pid /tmp/nginx.pid;
error_log stderr;
worker_shutdown_timeout 2s;
events { worker_connections 32; }
http {
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    log_format privacy_counts 'PRIVACY_REQUEST status=$status seconds=$request_time';
    access_log /dev/stdout privacy_counts;
    include /etc/nginx/preflight-override.conf;
}
