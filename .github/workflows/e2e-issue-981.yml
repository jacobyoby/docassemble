          docker exec da "$PY" /tmp/voice_signature_check.py

      - name: Issue-968 - patched server must report the real attribute
        run: bash .github/workflows/e2e/issue_968_repro.sh http://localhost:8080 da expect-pass

      - name: Issue-343 control - stock currency() must ignore currency_code
        run: |
          PY=$(docker exec da bash -c "ls /usr/share/docassemble/local*/bin/python3 | head -1")
          echo "PY=$PY" >> "$GITHUB_ENV"
          docker cp .github/workflows/e2e/currency_check.py da:/tmp/currency_check.py
          if ! docker exec da "$PY" /tmp/currency_check.py expect-fail; then
            echo "::notice::ALREADY FIXED upstream: issue 343 — currency_code already backed by babel"
          fi

      - name: Issue-343 - babel-backed currency_code must format correctly
        run: |
          C=$(docker exec da bash -c "ls /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/base/language/currency.py")
          docker cp docassemble_base/docassemble/base/language/currency.py da:"$C"
          docker exec da "$PY" /tmp/currency_check.py expect-pass

      - name: Issue-980 control - boolean config must crash the unpatched release
        run: |
          docker exec da bash -c "cp /usr/share/docassemble/config/config.yml /tmp/config.yml.bak && printf '%s\n' 'main page title url opens in other window: False' >> /usr/share/docassemble/config/config.yml && supervisorctl restart uwsgi"
          sleep 30
          if ! bash .github/workflows/e2e/issue_980_repro.sh http://localhost:8080 da expect-fail; then
            echo "::notice::ALREADY FIXED upstream: issue 980 — boolean config already handled"
          fi

      - name: Install this branch's parse.py and restart
        run: |
          P=$(docker exec da bash -c "ls /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/base/parse.py")
          docker cp docassemble_base/docassemble/base/parse.py da:"$P"
          docker exec da bash -c "supervisorctl restart uwsgi"
          sleep 30

      - name: Issue-980 - patched server must survive the boolean config
        run: |
          bash .github/workflows/e2e/issue_980_repro.sh http://localhost:8080 da expect-pass
          docker exec da bash -c "cp /tmp/config.yml.bak /usr/share/docassemble/config/config.yml && supervisorctl restart uwsgi"
          sleep 30

      - name: Issue-18 - install a11y templates, CSS, and interview page; skip link, 404 landmark, print rules must be present
        run: |
          WB=$(docker exec da bash -c "ls -d /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/webapp")
          docker cp docassemble_webapp/docassemble/webapp/templates/base_templates/base.html da:"$WB/templates/base_templates/base.html"
          docker cp docassemble_webapp/docassemble/webapp/templates/pages/404.html da:"$WB/templates/pages/404.html"
          docker cp docassemble_webapp/docassemble/webapp/static/app/app.css da:"$WB/static/app/app.css"
          docker cp docassemble_webapp/docassemble/webapp/static/app/app.min.css da:"$WB/static/app/app.min.css"
          docker cp docassemble_webapp/docassemble/webapp/interview/views.py da:"$WB/interview/views.py"
          # interview/views.py passes description= to standard_html_start; the head
          # builder that accepts it must land in the same step or the page 500s.
          docker cp docassemble_webapp/docassemble/webapp/utils/helpers.py da:"$WB/utils/helpers.py"
          docker exec da bash -c "supervisorctl restart uwsgi"
          sleep 30
          bash .github/workflows/e2e/a11y_check.sh http://localhost:8080 expect-pass

      - name: Issue-15 - install head builder and sitemap route; description, canonical, og:title, sitemap must be present
        run: |
          WB=$(docker exec da bash -c "ls -d /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/webapp")
          docker cp docassemble_webapp/docassemble/webapp/utils/helpers.py da:"$WB/utils/helpers.py"
          docker cp docassemble_webapp/docassemble/webapp/main/views.py da:"$WB/main/views.py"
          docker exec da bash -c "supervisorctl restart uwsgi"
          sleep 30
          bash .github/workflows/e2e/seo_check.sh http://localhost:8080 expect-pass https://law.example.org

      - name: Issue-19 - install FontAwesome CSS build; JS bundle gone, page weight must drop
        run: |
          WB=$(docker exec da bash -c "ls -d /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/webapp")
          docker cp docassemble_webapp/docassemble/webapp/static/fontawesome/css da:"$WB/static/fontawesome/css"
          docker cp docassemble_webapp/docassemble/webapp/static/fontawesome/webfonts da:"$WB/static/fontawesome/webfonts"
          bash .github/workflows/e2e/pagesize_check.sh http://localhost:8080 expect-pass

      - name: NFC - install this branch's pdftk.py; accented names must fill as NFC
        run: |
          B=$(docker exec da bash -c "ls /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/base/pdftk.py")
          docker cp docassemble_base/docassemble/base/pdftk.py da:"$B"
          PY=$(docker exec da bash -c "ls /usr/share/docassemble/local*/bin/python3 | head -1")
          docker exec da "$PY" /tmp/nfc_check.py /tmp/nfc_form.pdf fileNum expect-pass

      - name: Set up node for ALKiln
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Multiselect autocomplete browser e2e
        run: |
          SF=$(docker exec da bash -c "ls /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/base/standardformatter.py")
          docker cp docassemble_base/docassemble/base/standardformatter.py da:"$SF"
          ST=$(docker exec da bash -c "ls -d /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/webapp/static")
          docker cp docassemble_webapp/docassemble/webapp/static/tom-select da:"$ST/tom-select"
          D=$(docker exec da bash -c "ls -d /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/demo/data/questions")
          docker cp .github/workflows/e2e/test_autocomplete.yml da:"$D/test_autocomplete.yml"
          docker exec da bash -c "supervisorctl restart uwsgi"
          sleep 30
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
          npm install --no-fund --no-audit --ignore-scripts puppeteer-core@24.23.0
          node .github/workflows/e2e/tomselect_check.js

      - name: Issue-845 - navigation renders as a link once parse.py and the formatter are installed
        run: bash .github/workflows/e2e/issue_845_repro.sh http://localhost:8080 expect-pass

      - name: Browser e2e via ALKiln
        run: |
          npm install -g --ignore-scripts "@suffolklitlab/alkiln@^5.0.0"
          export PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser)"
          export BASE_URL=http://localhost:8080
          export SERVER_URL=http://localhost:8080
          export DOCASSEMBLE_DEVELOPER_API_KEY="$KEY"
          export REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          export BRANCH_NAME="${{ github.ref_name }}"
          alkiln-run "" --sources=.github/workflows/e2e/sources
