          PY=$(docker exec da bash -c "ls /usr/share/docassemble/local*/bin/python3 | head -1")
          docker exec da "$PY" /tmp/clicksend_auth_check.py

      - name: Telnyx fax signature - Ed25519 webhooks verified (#83)
        run: |
          C=$(docker exec da bash -c "ls /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/webapp/fax/views.py")
          docker cp docassemble_webapp/docassemble/webapp/fax/views.py da:"$C"
          docker cp .github/workflows/e2e/telnyx_signature_check.py da:/tmp/telnyx_signature_check.py
          PY=$(docker exec da bash -c "ls /usr/share/docassemble/local*/bin/python3 | head -1")
          docker exec da "$PY" /tmp/telnyx_signature_check.py

      - name: CSRF audit - exemptions gated by API keys or documented (#41)
        run: |
          W=$(docker exec da bash -c "ls -d /usr/share/docassemble/local*/lib/python3*/site-packages/docassemble/webapp")
          docker cp docassemble_webapp/docassemble/webapp/react/api.py da:"$W/react/api.py"
